<svg xmlns="http://www.w3.org/2000/svg" width="800" height="240" viewBox="0 0 800 240" font-family="'JetBrains Mono','Courier New',monospace" font-size="16">
  <rect width="800" height="240" rx="12" fill="#0d1117" stroke="#39FF14" stroke-opacity="0.45"/>
  <rect width="800" height="36" rx="12" fill="#161b22"/>
  <rect y="20" width="800" height="16" fill="#161b22"/>
  <circle cx="24" cy="18" r="5.5" fill="#ff5f56"/>
  <circle cx="44" cy="18" r="5.5" fill="#ffbd2e"/>
  <circle cx="64" cy="18" r="5.5" fill="#27c93f"/>
  <text x="400" y="23" text-anchor="middle" font-size="13" fill="#8b949e">maul@parrot: ~</text>

  <g opacity="0">
    <text x="28" y="78"><tspan fill="#39FF14">$</tspan><tspan fill="#c9d1d9"> whoami</tspan></text>
    <text x="28" y="102" fill="#39FF14">Muhammad Maulana Ikhlas</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.1s" fill="freeze"/>
  </g>

  <g opacity="0">
    <text x="28" y="140"><tspan fill="#39FF14">$</tspan><tspan fill="#c9d1d9"> cat focus.txt</tspan></text>
    <text x="28" y="164" fill="#39FF14">red teaming | ethical hacking | web security</text>
    <animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="0.1s" fill="freeze"/>
  </g>

  <g opacity="0">
    <text x="28" y="202"><tspan fill="#39FF14">$</tspan><tspan fill="#c9d1d9"> status</tspan></text>
    <text x="28" y="226" fill="#8b949e">learning in public</text>
    <rect x="178" y="213" width="9" height="16" fill="#39FF14">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
    <animate attributeName="opacity" from="0" to="1" begin="2.4s" dur="0.1s" fill="freeze"/>
  </g>
</svg>
